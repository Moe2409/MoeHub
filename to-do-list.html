<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link rel="stylesheet" href="style/main.css">
    <link rel="icon" href="pictures/LEON Logo.svg">
    <link rel="stylesheet" href="style/theme.css">
    <link rel="stylesheet" href="style/to-do-list.css">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.10.4/gsap.min.js" defer></script>
    <script src="script/colorTheme.js" defer></script>
    <script src="script/menu.js" defer></script>
</head>
<body>
    <main>
        <section id="menu">
            <input id="menu-icon" type="checkbox" onclick="menuPressed()">
            <label for="menu-icon" id="menu-icon-container">
                <div id="menu-icon-block1" class="menu-icon-block"></div>
                <div id="menu-icon-block2" class="menu-icon-block"></div>
                <div id="menu-icon-block3" class="menu-icon-block"></div>
            </label>
            <nav>
                <svg id="navbar" viewBox="0 0 238 238" preserveAspectRatio="none">
                    <!-- future
                    <defs>
                        <pattern id="image" x="0" y="0" patternUnits="userSpaceOnUse" height="100" width="100">
                                Scale the image to fit the pattern 
                            <image x="0" y="0" width="100" height="100" preserveAspectRatio="xMidYMid slice" xlink:href="https://cdn.britannica.com/79/232779-050-6B0411D7/German-Shepherd-dog-Alsatian.jpg"></image>
                        </pattern>
                    </defs>
                    <circle r="100" cx="100" cy="100" fill="url(#image)" />
                    -->
                    <circle r="100" cx="119" cy="119" />
                </svg>
            </nav>
        </section>
        <section id="projectContainer">
            <article id="project1" class="project" onclick="expandProject(this)" role="button">
                <h2>To Do List</h2>
                <div class="progressContainer">
                    <div class="progressBar">
                        <div id="progress1"></div>
                    </div>
                    <span>20%</span>
                </div>
                <div class="priorityTasks">
                    <div class="taskRow">
                        <input id="task1" type="checkbox">
                        <label for="task1">Finishing a task layout</label>
                    </div>
                </div>
                <!--<div id="notePad" contenteditable="true">
                    Skriv her...
                </div>-->
            </article>
            <article id="project2" class="project" onclick="expandProject(this)">
                <h2>Electric-Skateboard</h2>
                <div class="progressContainer">
                    <div style="margin-left: 1rem;">[||||||||||..........]</div>
                    <span>50%</span>
                </div>
                <div class="priorityTasks">
                    <div class="taskRow">
                        <input id="task2" type="checkbox">
                        <label for="task2">Finishing a task layout</label>
                    </div>
                </div>
            </article>
        </section>
        <section id="addProject">
            <input type="text">
            <input type="button">
        </section>
    </main>
</body>
</html>
